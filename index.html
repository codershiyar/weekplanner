* { box-sizing: border-box; }
html, body { margin: 0; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right)) 56px max(16px, env(safe-area-inset-left)); display: grid; gap: 20px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }

.welcome { background: var(--accent-soft); border-radius: 14px; padding: 12px 16px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.theme-switch { position: relative; width: 60px; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0; flex: none; }
.theme-switch .knob { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; transition: transform .25s ease; }
.theme-switch[aria-checked="true"] .knob { transform: translateX(26px); }

.theme-switch .moon { opacity: 0; transform: rotate(-60deg); }

/* Goals */
.goals { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
@media (max-width: 520px) { .goals { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .goal { padding: 12px; } .goal .val { font-size: 18px; } }
.goal { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }

.parts { display: flex; flex-wrap: wrap; gap: 6px; }

.task { position: relative; background: var(--cb); border: 1px solid transparent; border-radius: 12px; padding: 8px 8px 10px 10px; display: grid; gap: 2px; min-width: 0; }
.task.example { border-style: dashed; border-color: var(--cf); border-color: color-mix(in srgb, var(--cf) 45%, transparent); }
.task.dragging { opacity: .35; }

.task-head { display: flex; align-items: center; gap: 8px; min-height: 26px; }
.task-head .cat { flex: 1; min-width: 0; color: var(--cf); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-body { border: none; background: none; padding: 0; margin: 0; text-align: left; width: 100%; min-width: 0; display: grid; gap: 3px; cursor: pointer; color: inherit; font: inherit; border-radius: 6px; }
.task-body > span { display: block; min-width: 0; }
.time { display: flex !important; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.time .len { font-family: var(--font); }
.time svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.check { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; border: 2px solid var(--cf); border-color: color-mix(in srgb, var(--cf) 40%, transparent); border-radius: 6px; flex: none; margin: 0; display: grid; place-items: center; cursor: pointer; background: var(--surface); }

.grip { border: none; background: transparent; color: var(--muted); width: 24px; height: 26px; display: grid; place-items: center; cursor: grab; touch-action: none; flex: none; border-radius: 7px; padding: 0; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 18px; padding: 18px; display: grid; gap: 14px; }

.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { position: relative; cursor: pointer; }
.swatch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.swatch span { display: block; width: 30px; height: 30px; border-radius: 50%; background: var(--cf); box-shadow: inset 0 0 0 3px var(--cb); }
.swatch input:checked + span { outline: 2px solid var(--ink); outline-offset: 2px; }
.swatch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.slot-rows { display: grid; gap: 8px; }
.slot-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px auto; gap: 6px; align-items: center; }
.slot-row select, .slot-row input { padding: 9px 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; padding-top: 6px; }
.actions .group { display: flex; gap: 8px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-size: 14px; font-weight: 500; max-width: calc(100vw - 32px); z-index: 70; box-shadow: 0 8px 24px rgba(0,0,0,.2); }

@media (prefers-reduced-motion: no-preference) {
  .task, .btn, .chip, .add, .cat-card { transition: filter .15s, background-color .15s, border-color .15s; }
  .task:hover { filter: brightness(.98); }
  .grip { transition: opacity .15s; }
}

/* Print: one A4 page in landscape */
@page { size: A4 landscape; margin: 10mm; }
body.printing { background: #fff; color: #16161D; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body.printing .wrap { width: 277mm; max-width: none; padding: 0; gap: 10px; }
body.printing .nav, body.printing .welcome, body.printing #goals, body.printing #categories, body.printing #data,
body.printing .footer, body.printing .add, body.printing .grip, body.printing .note-btn svg, body.printing .toast, body.printing dialog { display: none !important; }
body.printing .week { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
body.printing .day, body.printing .panel { box-shadow: none; border-color: #DDDDE3; background: #fff; opacity: 1; padding: 8px; border-radius: 10px; }
body.printing .day { min-height: 110mm; }
body.printing .task { padding: 5px 6px; }
body.printing .title { font-size: 11px; }
body.printing .tip, body.printing .time, body.printing .task-head .cat { font-size: 9px; }
body.printing .check { width: 13px; height: 13px; border-color: #9A9AA8; }
body.printing .panel h2 { font-size: 14px; }
body.printing .rule-list { gap: 6px; }
body.printing .rule-list li { font-size: 10px; padding: 6px 8px; }
</style>

        <button type="button" id="today" data-i18n="today"></button>
        <button type="button" id="next" data-i18n-aria="nextWeek"><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <button type="button" class="btn soft" id="auto-plan" data-i18n-title="autoPlanTitle"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg><span data-i18n="autoPlan"></span></button>

      <button type="button" class="btn" id="welcome-close" data-i18n="welcomeClose"></button>

  </div>

      <div class="group">

</dialog>

<dialog id="cat-dialog">

  // State and storage

  const $ = id => document.getElementById(id);
  let firstVisit = false;
  let state = load();
  let weekStart = mondayOf(new Date());
  let editingTask = null, editingDate = null, editingCat = null;
  let pauseWeekRender = false, rulesOpen = false, saveWarned = false;

  function blankState(lang, theme) { return { lang, theme: theme || null, items: [], cats: null, rules: null, notes: null, welcomeSeen: false }; }

  function load() {
    const urlLang = new URLSearchParams(location.search).get("lang");
    let data = null;
    try { data = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { data = null; }
    const s = blankState("nl");
    if (data && Array.isArray(data.items)) {
      s.lang = data.lang === "en" ? "en" : "nl";
      s.items = data.items;
      s.cats = Array.isArray(data.cats) ? data.cats : null;
      s.rules = data.rules && Array.isArray(data.rules.items) ? data.rules : null;
      s.notes = Array.isArray(data.notes) ? data.notes : null;
      s.welcomeSeen = !!data.welcomeSeen;
      s.theme = data.theme === "dark" || data.theme === "light" ? data.theme : null;
    }
    else firstVisit = true;
    if (urlLang === "en" || urlLang === "nl") s.lang = urlLang;
    return s;
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { if (!saveWarned) { saveWarned = true; toast(t("saveFail")); } }
  }

  function commit() { save(); render(); }

  // Text helpers

  function L() { return TEXT[state.lang]; }
  function t(key, vars) {
    let s = L()[key];
    if (s === undefined) return key;
    if (vars) Object.keys(vars).forEach(k => { s = s.split("{" + k + "}").join(vars[k]); });
    return s;
  }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>"); }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  function applyStaticText() {
    document.documentElement.lang = state.lang;
    document.title = t("docTitle");
    const meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute("content", t("docDesc"));
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
    $("lengths").innerHTML = LENGTHS.map(m => `<button type="button" class="chip" data-min="${m}">${L().lengthLabel(m)}</button>`).join("");
  }

  // Dates and times

  function pad(n) { return String(n).padStart(2, "0"); }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); }
  function weekday(d) { return (d.getDay() + 6) % 7; }
  function weekNumber(d) {
    const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const n = x.getUTCDay() || 7;
    x.setUTCDate(x.getUTCDate() + 4 - n);
    const y = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
    return Math.ceil(((x - y) / 864e5 + 1) / 7);
  }
  function minutes(t) { if (!t) return 0; const [h, m] = t.split(":").map(Number); return h * 60 + m; }
  function clock(m) { m = Math.max(0, Math.min(23 * 60 + 59, m)); return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
  function length(m) {
    if (m <= 0) return "";
    if (m < 60) return m + " min";
    const h = Math.floor(m / 60), r = m % 60;
    return h + L().hour + (r ? " " + r : "");
  }
  function dayName(i) { return L().days[i]; }
  function dayInText(i) { return state.lang === "nl" ? dayName(i).toLowerCase() : dayName(i); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // Categories

  function normCat(c) {
    const n = Object.assign({ id: "", name: t("other"), title: "", color: "grey", goalMin: 0, goalMax: 0, length: 60,
      allDay: false, wholeDay: false, once: false, slots: [], parts: [], hint: "", doneHint: "" }, c || {});
    n.goalMin = Math.max(0, +n.goalMin || 0);
    n.goalMax = Math.max(n.goalMin, +n.goalMax || 0);
    n.length = Math.max(0, +n.length || 0);
    n.slots = Array.isArray(n.slots) ? n.slots.filter(s => s && s.day >= 0 && s.day <= 6) : [];
    n.parts = Array.isArray(n.parts) ? n.parts.filter(p => p && p.name) : [];
    if (!COLORS.includes(n.color)) n.color = "grey";
    return n;
  }
  function cats() { return (state.cats || L().defaults.cats).map(normCat); }
  function catById(id) { return cats().find(c => c.id === id) || normCat({ id: id || "" }); }
  function goalText(c) { return L().goalText(c); }

  function partCounts(c) {
    const from = iso(addDays(weekStart, -21)), to = iso(addDays(weekStart, 6)), count = {};
    c.parts.forEach(p => { count[p.name] = 0; });
    state.items.forEach(it => {
      if (it.cat !== c.id || !it.date || it.date < from || it.date > to) return;
      if (it.part === "Mix") c.parts.forEach(p => { count[p.name] += 0.5; });
      else if (count[it.part] !== undefined) count[it.part]++;
    });
    return count;
  }
  function nextPart(c, extra) {
    if (!c.parts.length) return null;
    const count = partCounts(c);
    (extra || []).forEach(k => { if (count[k] !== undefined) count[k]++; });
    return c.parts.reduce((best, p) => count[p.name] < count[best.name] ? p : best, c.parts[0]).name;
  }
  function partTip(c, name) {
    if (name === "Mix") return t("mixTip");
    const p = c.parts.find(x => x.name === name);
    return p ? p.tip : "";
  }

  // Tasks

  function occursOn(it, date) {
    const s = iso(date);
    if (it.repeat === "weekly") {
      if (it.weekday !== weekday(date)) return false;
      if (it.startDate && s < it.startDate) return false;
      return !(it.skipDates || []).includes(s);
    }
    return it.date === s;
  }
  function isDone(it, s) { return it.repeat === "weekly" ? (it.doneDates || []).includes(s) : !!it.done; }
  function tasksOn(date) {
    return state.items.filter(it => occursOn(it, date))
      .sort((a, b) => (b.allDay ? 1 : 0) - (a.allDay ? 1 : 0) || minutes(a.start) - minutes(b.start));
  }
  function warningsFor(it, list) {
    const out = [];
    const whole = list.find(o => o !== it && catById(o.cat).wholeDay);
    if (whole && !catById(it.cat).wholeDay) out.push(t("clash", { name: catById(whole.cat).name }));
    if (it.allDay) return out;
    const a = minutes(it.start), b = minutes(it.end);
    if (list.some(o => o !== it && !o.allDay && minutes(o.start) < b && minutes(o.end) > a)) out.push(t("overlap"));
    if (b <= a) out.push(t("endsEarly"));
    return out;
  }
  function addTask(data) { state.items.push(Object.assign({}, data, { id: uid() })); }
  function updateTask(id, data) { const i = state.items.findIndex(x => x.id === id); if (i > -1) state.items[i] = Object.assign({}, data, { id }); }
  function removeTask(id) { state.items = state.items.filter(x => x.id !== id); }
  function copy(it) { const c = JSON.parse(JSON.stringify(it)); delete c.id; return c; }

  // Rendering

  const ICON_PLUS = '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
  const ICON_PEN = '<svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
  const ICON_UP = '<svg class="i" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>';
  const ICON_DOWN = '<svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
  const ICON_TRASH = '<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
  const ICON_REPEAT = '<svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/></svg>';
  const ICON_GRIP = '<svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>';

  function weekStats() {
    const stats = {};
    cats().forEach(c => { stats[c.id] = { planned: 0, done: 0, day: null, mins: 0 }; });
    let total = 0, finished = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(weekStart, i), key = iso(d);
      tasksOn(d).forEach(it => {
        const done = isDone(it, key);
        if (it.repeat !== "weekly") { total++; if (done) finished++; }
        const s = stats[it.cat];
        if (!s) return;
        s.planned++;
        if (done) s.done++;
        if (s.day === null) s.day = i;
        if (!it.allDay) s.mins += Math.max(0, minutes(it.end) - minutes(it.start));
      });
    }
    return { stats, total, finished };
  }

  function dots(n, planned, done) {
    let h = '<div class="dots">';
    for (let i = 0; i < Math.max(n, planned); i++) h += `<span class="dot ${i < done ? "done" : i < planned ? "plan" : ""}"></span>`;
    return h + "</div>";
  }

  function renderGoals() {
    const { stats, total, finished } = weekStats();
    const pct = total ? Math.round(finished / total * 100) : 0;
    let h = `<div class="goal"><div class="lbl">${t("progress")}</div><div class="val">${pct}%</div>
      <div class="progress"><span style="width:${pct}%"></span></div><div class="sub">${t("progressSub", { d: finished, t: total })}</div></div>`;
    cats().filter(c => c.goalMax > 0).forEach(c => {
      const s = stats[c.id], single = c.goalMax === 1;
      const val = single ? (s.done ? t("done") : s.planned ? dayName(s.day) : t("noDay")) : t("doneOf", { d: s.done, p: s.planned });
      let sub;
      if (s.planned && s.done >= s.planned && s.done >= c.goalMin) sub = c.doneHint || t("doneDefault");
      else if (s.planned < c.goalMin) sub = single ? t("pickDay") : t("planMore", { n: c.goalMin - s.planned });
      else if (s.planned > c.goalMax) sub = t("tooMuch");
      else sub = c.hint || t("onTrack");
      if (!single && s.mins && !c.allDay) sub += " " + t("total", { t: length(s.mins) });
      h += `<div class="goal col-${c.color}"><div class="lbl"><span class="cdot"></span>${esc(c.name)}, ${esc(goalText(c))}</div>
        <div class="val">${esc(val)}</div>${dots(c.goalMax, s.planned, s.done)}<div class="sub">${esc(sub)}</div></div>`;
    });
    cats().filter(c => c.parts.length).forEach(c => {
      const count = partCounts(c), next = nextPart(c);
      h += `<div class="goal col-${c.color}"><div class="lbl"><span class="cdot"></span>${esc(t("nextPart", { name: c.name }))}</div>
        <div class="val">${esc(next)}</div>
        <div class="parts">${c.parts.map(p => `<span class="part ${p.name === next ? "next" : ""}">${esc(p.name)} ${Math.round(count[p.name] * 10) / 10}</span>`).join("")}</div>
        <div class="sub">${t("partCount")}</div></div>`;
    });
    $("goals").innerHTML = h;
  }

  function noteFor(i) { const n = state.notes || L().defaults.notes; return typeof n[i] === "string" ? n[i] : ""; }

  function renderWeek() {
    const todayKey = iso(new Date()), end = addDays(weekStart, 6), m = L().months;
    $("week-number").textContent = "Week " + weekNumber(weekStart);
    const a = weekStart.getMonth() === end.getMonth() ? String(weekStart.getDate()) : weekStart.getDate() + " " + m[weekStart.getMonth()];
    $("week-range").textContent = t("range", { a, b: end.getDate() + " " + m[end.getMonth()] + " " + end.getFullYear() });

    let h = "";
    for (let i = 0; i < 7; i++) {
      const d = addDays(weekStart, i), key = iso(d), list = tasksOn(d);
      const cls = key === todayKey ? "today" : key < todayKey ? "past" : "";
      const body = !list.length ? `<div class="empty">${t("nothing")}</div>` : list.map(it => {
        const c = catById(it.cat), done = isDone(it, key), warns = warningsFor(it, list);
        const time = it.allDay ? t("allDay") : `${esc(it.start)} - ${esc(it.end)}`;
        const len = it.allDay ? "" : length(minutes(it.end) - minutes(it.start));
        const repeat = it.repeat === "weekly" ? `<span title="${esc(t("weekly"))}" aria-label="${esc(t("weekly"))}">${ICON_REPEAT}</span>` : "";
        const tip = it.part ? partTip(c, it.part) : "";

  $("week").addEventListener("pointerdown", e => {

    ghost.style.width = rect.width + "px";
    ghost.style.left = rect.left + "px";
    ghost.style.top = rect.top + "px";

    drag = { id: grip.dataset.grip, from: grip.dataset.date, ghost, row, dx: e.clientX - rect.left, dy: e.clientY - rect.top, over: null };
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* not supported */ }

  // Auto plan: uses each category's weekly goal and preferred times

  function buildPlan(allowPast) {
    const now = new Date(), todayKey = iso(now), nowMin = now.getHours() * 60 + now.getMinutes();
    const day = i => addDays(weekStart, i), plan = [], summary = [];
    const on = i => { const key = iso(day(i)); return [...tasksOn(day(i)), ...plan.filter(p => p.date === key)]; };
    const list = cats();
    const order = [...list.filter(c => c.wholeDay), ...list.filter(c => !c.wholeDay)].filter(c => c.goalMax > 0 && c.slots.length);

    for (const c of order) {
      let planned = 0;
      const usedDays = [];
      for (let i = 0; i < 7; i++) { const n = on(i).filter(x => x.cat === c.id).length; planned += n; if (n) usedDays.push(i); }
      if (planned >= c.goalMax) continue;
      let need = (planned < c.goalMin ? c.goalMin : planned + 1) - planned;
      const picked = [], partsUsed = [];

      // First pass keeps a free day between sessions, second pass fills the rest
      for (const pass of [0, 1]) {
        for (const slot of c.slots) {
          if (need <= 0) break;
          const i = slot.day, key = iso(day(i)), tasks = on(i);
          const start = c.allDay ? "00:00" : slot.start;
          const end = c.allDay ? "23:59" : clock(minutes(slot.start) + (c.length || 60));
          if (!allowPast && (key < todayKey || (key === todayKey && (c.allDay || c.wholeDay || minutes(start) <= nowMin)))) continue;
          if (picked.includes(i)) continue;
          if (c.once && tasks.some(x => x.cat === c.id)) continue;
          if (pass === 0 && [...picked, ...usedDays].some(k => Math.abs(k - i) === 1)) continue;
          if (c.wholeDay || c.allDay) { if (tasks.length) continue; }
          else {
            if (tasks.some(x => catById(x.cat).wholeDay || x.allDay)) continue;
            if (tasks.some(x => minutes(x.start) < minutes(end) && minutes(x.end) > minutes(start))) continue;
          }
          const part = nextPart(c, partsUsed);
          plan.push({ title: part ? c.name + ": " + part.toLowerCase() : (c.title || c.name), cat: c.id, part, date: key, start, end,
            allDay: !!c.allDay, repeat: "none", weekday: null, startDate: null, done: false, doneDates: [], skipDates: [], note: "",
            createdAt: now.toISOString() });
          picked.push(i);
          if (part) partsUsed.push(part);
          need--;
        }
      }
      if (picked.length) {
        summary.push(picked.length === 1 && c.goalMax === 1
          ? t("plannedOne", { name: c.name, day: dayInText(picked[0]) })
          : t("plannedMany", { n: picked.length, name: c.name }));
      }
    }
    return { plan, summary };
  }

  $("auto-plan").addEventListener("click", () => {
    const { plan, summary } = buildPlan();
    if (!plan.length) { toast(t("nothingToPlan")); return; }
    plan.forEach(addTask);
    state.welcomeSeen = true;
    commit();
    toast(t("planned", { list: summary.join(", ") }));
  });

  // Example week for first-time visitors

  function seedExamples() {
    const startDate = iso(weekStart);
    cats().filter(c => !c.goalMax && c.slots.length).forEach(c => {
      c.slots.forEach(slot => addTask({ title: c.title || c.name, cat: c.id, part: null, allDay: !!c.allDay,
        start: slot.start, end: clock(minutes(slot.start) + (c.length || 60)), note: "", repeat: "weekly", date: null,
        weekday: slot.day, startDate, done: false, doneDates: [], skipDates: [], example: true, createdAt: new Date().toISOString() }));
    });
    buildPlan(true).plan.forEach(it => addTask(Object.assign(it, { example: true })));
    state.welcomeSeen = false;
    save();
  }

  function onlyExamples() { return state.items.length > 0 && state.items.every(it => it.example); }

  $("clear-examples").addEventListener("click", () => {
    state.items = state.items.filter(it => !it.example);
    state.welcomeSeen = true;
    commit();
    toast(t("examplesCleared"));
  });

  // Rules

  function ruleRow(r) {
    const n = rowSeq++;
    return `<div class="rule-row">
      <input id="rule-title-${n}" type="text" maxlength="60" placeholder="${esc(t("ruleHeadPh"))}" value="${esc(r.title || "")}" aria-label="${esc(t("ruleHeadPh"))}">
      <div class="icon-btns">
        <button type="button" class="icon-btn" data-up aria-label="${esc(t("up"))}">${ICON_UP}</button>
        <button type="button" class="icon-btn" data-down aria-label="${esc(t("down"))}">${ICON_DOWN}</button>
        <button type="button" class="icon-btn del" data-remove aria-label="${esc(t("remove"))}">${ICON_TRASH}</button>
      </div>
      <textarea id="rule-text-${n}" rows="2" maxlength="500" placeholder="${esc(t("ruleTextPh"))}" aria-label="${esc(t("ruleTextPh"))}">${esc(r.text || "")}</textarea>
    </div>`;
  }
  function openRules() {
    const r = state.rules || L().defaults.rules;
    rulesOpen = true;
    $("rule-heading").value = r.heading || "";
    $("rule-rows").innerHTML = r.items.map(ruleRow).join("");
    $("rules-view").hidden = true;
    $("rules-form").hidden = false;
    $("rules-edit").hidden = true;
  }
  function closeRules() {
    rulesOpen = false;
    $("rules-view").hidden = false;
    $("rules-form").hidden = true;
    $("rules-edit").hidden = false;
    renderRules();
  }
  $("rules-edit").addEventListener("click", openRules);
  $("rules-cancel").addEventListener("click", closeRules);
  $("rule-add").addEventListener("click", () => {
    $("rule-rows").insertAdjacentHTML("beforeend", ruleRow({ title: "", text: "" }));
    $("rule-rows").lastElementChild.querySelector("input").focus();
  });
  $("rule-rows").addEventListener("click", e => moveRow(e, ".rule-row"));
  $("rules-save").addEventListener("click", () => {
    const items = [...$("rule-rows").querySelectorAll(".rule-row")]
      .map(r => ({ title: r.querySelector("input").value.trim(), text: r.querySelector("textarea").value.trim() }))
      .filter(r => r.title || r.text);
    state.rules = { heading: $("rule-heading").value.trim() || L().defaults.rules.heading, items };
    closeRules();
    commit();
    toast(t("rulesSaved"));
  });

  // Backup, restore and reset

  $("export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "weekplanner-backup-" + iso(new Date()) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  $("import-file").addEventListener("change", e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.items)) throw new Error("invalid");
        state = Object.assign(blankState(data.lang === "en" ? "en" : "nl", state.theme), {
          items: data.items,
          cats: Array.isArray(data.cats) ? data.cats : null,
          rules: data.rules && Array.isArray(data.rules.items) ? data.rules : null,
          notes: Array.isArray(data.notes) ? data.notes : null,
          welcomeSeen: true
        });
        applyStaticText();
        commit();
        toast(t("imported"));
      } catch (err) {
        toast(t("importFail"));
      }
    };
    reader.readAsText(file);
  });

  $("reset").addEventListener("click", () => {
    const b = $("reset");
    if (!b.classList.contains("armed")) {
      b.classList.add("armed");
      b.textContent = t("resetSure");
      setTimeout(() => { b.classList.remove("armed"); b.textContent = t("reset"); }, 4000);
      return;
    }
    state = blankState(state.lang, state.theme);
    b.classList.remove("armed");
    b.textContent = t("reset");
    commit();
    toast(t("resetDone"));
  });

  // Language

  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
    if (state.lang === b.dataset.lang) return;
    const redoExamples = onlyExamples() && !state.welcomeSeen;
    state.lang = b.dataset.lang;
    if (redoExamples) { state.items = []; seedExamples(); }
    const url = new URL(location.href);
    url.searchParams.delete("lang");
    history.replaceState(null, "", url);
    applyStaticText();
    commit();
  }));

  // Light and dark mode

  const systemDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function currentTheme() { return state.theme || (systemDark && systemDark.matches ? "dark" : "light"); }
  function applyTheme() {
    if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
    else document.documentElement.removeAttribute("data-theme");
    $("theme").setAttribute("aria-checked", String(currentTheme() === "dark"));
  }
  $("theme").addEventListener("click", () => {
    state.theme = currentTheme() === "dark" ? "light" : "dark";
    applyTheme();
    save();
  });
  if (systemDark && systemDark.addEventListener) systemDark.addEventListener("change", applyTheme);

  // Print on one A4 page

  function fitToPage() {
    const wrap = document.querySelector(".wrap");
    wrap.style.zoom = "";
    const maxHeight = 190 * 96 / 25.4;
    const height = wrap.scrollHeight;
    if (height > maxHeight) wrap.style.zoom = (maxHeight / height).toFixed(3);
  }
  window.addEventListener("beforeprint", () => {
    document.documentElement.setAttribute("data-theme", "light");
    document.body.classList.add("printing");
    fitToPage();
  });
  window.addEventListener("afterprint", () => {
    document.body.classList.remove("printing");
    document.querySelector(".wrap").style.zoom = "";
    applyTheme();
  });
  $("print").addEventListener("click", () => window.print());

  // Start

  if (firstVisit) seedExamples();
  applyTheme();
  applyStaticText();
  render();
})();
</script>
</body>
</html>
